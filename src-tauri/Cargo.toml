[package]
name = "dsh-launcher"
version = "0.1.0"
description = "DSH 的菜单栏启动器：启动本地 dsh web 服务，托盘里打开浏览器"
authors = ["Drswith"]
license = "MIT"
edition = "2021"

[lib]
# `_lib` 后缀看着多余，但 Windows 上 lib 和 bin 用同一个名字会冲突
# （cargo 的已知问题：https://github.com/rust-lang/cargo/issues/8519）。
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "dsh-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标/菜单；image-png：内置的 PNG 托盘图标要在运行时解码。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
tauri-plugin-opener = "2"
# 退出确认弹窗。
tauri-plugin-dialog = "2"
# 反馈慢启动和 dsh 就绪；错误仍使用 dialog，避免同一事件重复提示。
tauri-plugin-notification = "2"
# 登录启动和轻量用户偏好。
tauri-plugin-autostart = "2.0.1"
tauri-plugin-store = "2.2.0"
# 只用来解析 `dsh web` 就绪行里的地址（core:default 权限不需要它，纯 Rust 内部用）。
url = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# 启动时按 pid 找上次遗留的孤儿 dsh 进程；只要进程查询/kill 这一小块，关掉
# 磁盘/网络/组件之类用不到的模块。
sysinfo = { version = "0.38", default-features = false, features = ["system"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
