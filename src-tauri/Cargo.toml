[package]
name = "dsh-launcher"
version = "0.1.0"
description = "DSH 的菜单栏启动器：启动本地 dsh web 服务，托盘里打开浏览器"
authors = ["Drswith"]
license = "MIT"
edition = "2021"

[lib]
# `_lib` 后缀看着多余，但 Windows 上 lib 和 bin 用同一个名字会冲突
# （cargo 的已知问题：https://github.com/rust-lang/cargo/issues/8519）。
name = "dsh_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
path = "src/lib.rs"

[[bin]]
name = "dsh-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon：托盘图标/菜单；image-png：内置的 PNG 托盘图标要在运行时解码。
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-opener = "2"
# 只用来解析 `dsh web` 就绪行里的地址（core:default 权限不需要它，纯 Rust 内部用）。
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
