[package]
name = "dsh-launcher"
version = "0.0.0"
description = "DSH 的菜单栏启动器：安装运行时、托管本地 dsh web 服务"
authors = ["Drswith"]
license = "MIT"
edition = "2021"
rust-version = "1.82"

[lib]
name = "dsh_launcher"
path = "src/lib.rs"

[[bin]]
name = "dsh-launcher"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
libc = "0.2"
url = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = [
  "objc2-core-services",
  "NSAppleEventDescriptor",
  "NSAppleEventManager",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSLocale",
  "NSNotification",
  "NSObjCRuntime",
  "NSOperation",
  "NSString",
  "NSURL",
  "NSUserDefaults",
  "NSValue",
] }
objc2-app-kit = { version = "0.3", features = [
  "NSAlert",
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSGraphics",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSPasteboard",
  "NSResponder",
  "NSRunningApplication",
  "NSView",
  "NSWindow",
  "NSWorkspace",
] }
objc2-service-management = { version = "0.3", features = ["SMAppService"] }
block2 = "0.6"
muda = "0.19"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
