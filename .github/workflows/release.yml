name: Release

# Pushing a v* tag builds both architectures and publishes a GitHub release.
# Running the workflow by hand is a dry run: it builds and uploads the
# artifacts for the given version but creates no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing (dry run), e.g. 0.2.0-rc.1
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Resolve the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      prerelease: ${{ steps.resolve.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: resolve
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then version="${GITHUB_REF_NAME#v}"; else version="$INPUT_VERSION"; fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::version '$version' must look like 1.2.3 or 1.2.3-beta.1 (tag v1.2.3)"
            exit 1
          fi
          # Build numbers are commit counts, which only grow along main.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; release from main"
            exit 1
          fi
          prerelease=false
          if [[ "$version" == *-* ]]; then prerelease=true; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Building $version (prerelease: $prerelease) from $GITHUB_SHA"

  build:
    name: Build (macOS ${{ matrix.arch }})
    needs: version
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
      APP_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Check the runner and set the build number
        run: |
          test "$(uname -m)" = "$ARCH" || { echo "runner is $(uname -m), expected $ARCH"; exit 1; }
          echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      # Reuse CI's download and pnpm caches; a tag-scoped cache would help nobody.
      - uses: actions/cache/restore@v6
        with:
          path: .cache
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/pnpm-lock.yaml', 'deepseek-harness/package.json', 'deepseek-harness/apps/desktop/scripts/prepare-runtime.ts') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Unit and integration tests
        run: swift test

      - name: Build the app
        run: make app

      - name: Package the disk image and the update archive
        run: |
          scripts/make-dmg.sh
          ditto -c -k --keepParent "build/DSH Launcher.app" "build/DSH-Launcher-$APP_VERSION-$ARCH.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the GitHub release
    needs: [version, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PRERELEASE: ${{ needs.version.outputs.prerelease }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true

      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create the release
        run: |
          (cd dist && shasum -a 256 *.dmg *.zip > SHA256SUMS.txt)
          # The bundled runtime versions, from the same sources the build used.
          source scripts/config.sh
          notes="$(mktemp)"
          sed -e "s/{{VERSION}}/$VERSION/g" \
              -e "s/{{DSH_VERSION}}/$LOCKED_DSH_VERSION/g" \
              -e "s/{{NODE_VERSION}}/$NODE_VERSION/g" \
              -e "s/{{PNPM_VERSION}}/$PNPM_VERSION/g" \
              .github/release-notes.md > "$notes"
          flags=(--verify-tag --title "DSH Launcher $VERSION" --notes-file "$notes" --generate-notes)
          if [ "$PRERELEASE" = true ]; then flags+=(--prerelease); fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            # A re-run replaces the assets of the existing release.
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* "${flags[@]}"
          fi
