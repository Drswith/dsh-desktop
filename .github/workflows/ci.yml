name: CI

# 只做“能编译、测试过”这两件事，不出安装包、不发版——那些等真的要分发了再加。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: 测试 + lint（macOS，唯一实际跑过的平台）
    runs-on: macos-26
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise/cargo/registry
            ~/.local/share/mise/cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'mise.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - run: mise run lint
      - run: mise run test

  compile-check:
    name: 跨平台编译检查（${{ matrix.name }}）
    # 只确认三个平台都能编译通过，不产出安装包、也没有在这些平台上点击验证过。
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            name: macOS
          - os: windows-2025
            name: Windows
          - os: ubuntu-24.04
            name: Linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: 装 Linux 的 WebView / 托盘依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - uses: actions/cache@v6
        with:
          path: |
            ~/.local/share/mise/cargo/registry
            ~/.local/share/mise/cargo/git
            src-tauri/target
          key: cargo-${{ runner.os }}-${{ hashFiles('src-tauri/Cargo.lock', 'mise.toml') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --all-targets --locked
