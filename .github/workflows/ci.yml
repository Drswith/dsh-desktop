name: CI

# Pushes and pull requests test and build both architectures. A pushed v* tag
# also publishes the disk images as a GitHub release; a manual run keeps them
# as artifacts, to try a build before releasing it.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Keyed on the event too, so a manual run never cancels the push run of the same commit.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # Full history: the version describes the nearest v* tag, and the
          # build number counts commits.
          fetch-depth: 0

      # Node.js and pnpm downloads plus the pnpm store; keyed on everything that
      # decides what the runtime installs.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/pnpm-lock.yaml', 'deepseek-harness/package.json', 'deepseek-harness/apps/desktop/scripts/prepare-runtime.ts') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Unit and integration tests
        run: swift test

      - name: Build the app and the disk image
        run: |
          # A tag build takes its version from that tag, even when another tag marks the same commit.
          if [ "$GITHUB_REF_TYPE" = tag ]; then export APP_VERSION="${GITHUB_REF_NAME#v}"; fi
          make app
          scripts/make-dmg.sh

      - if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: dmg-${{ matrix.arch }}
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish the GitHub release
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          pattern: dmg-*
          path: dist
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          dsh="$(sed -n 's/^    "@deepseek-ai\/dsh": "\(.*\)"$/\1/p' runtime/package.json)"
          (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt)
          sed -e "s/{{VERSION}}/$version/g" -e "s/{{DSH_VERSION}}/$dsh/g" .github/release-notes.md > "$RUNNER_TEMP/notes.md"
          # A suffixed tag such as v0.2.0-beta.1 is a prerelease.
          prerelease=()
          if [[ "$version" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" dist/* --title "DSH Launcher $version" \
            --notes-file "$RUNNER_TEMP/notes.md" --generate-notes "${prerelease[@]}"
