name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build (macOS ${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-26
          - arch: x86_64
            runner: macos-26-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      # CI holds no certificate, so builds are signed ad hoc; the run number
      # gives CI images a monotonic build number.
      BUILD_NUMBER: ${{ github.run_number }}
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          # Full history, so the version label can describe the nearest v* tag.
          fetch-depth: 0

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          # A mislabeled runner would otherwise cross-build under Rosetta and still pass.
          test "$(uname -m)" = "$ARCH" || { echo "runner is $(uname -m), expected $ARCH"; exit 1; }
          swift --version

      # Node.js and pnpm downloads plus the pnpm store; keyed on everything that
      # decides what the runtime installs.
      - uses: actions/cache@v6
        with:
          path: .cache
          key: runtime-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('runtime/pnpm-lock.yaml', 'deepseek-harness/package.json', 'deepseek-harness/apps/desktop/scripts/prepare-runtime.ts') }}
          restore-keys: |
            runtime-${{ runner.os }}-${{ runner.arch }}-

      - name: Check shell scripts
        run: for script in scripts/*.sh; do bash -n "$script"; done

      - name: Unit and integration tests
        run: swift test

      - name: Build the app
        run: make app

      - name: Build the disk image
        run: scripts/make-dmg.sh

      - uses: actions/upload-artifact@v7
        with:
          name: DSH-Launcher-${{ github.run_number }}-${{ matrix.arch }}
          path: build/*.dmg
          if-no-files-found: error
          retention-days: 14
