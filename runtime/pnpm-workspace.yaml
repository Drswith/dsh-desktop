# The npm project bundled as the app's runtime (installed into runtime.tar.gz as app/).
# Settings follow the official desktop seed (apps/desktop/src/project-manager.ts) except
# autoInstallPeers: upstream lists every first-party package explicitly, while this
# registry install relies on pnpm to satisfy the plugin packages' service peerDependencies.
# Update the lock with `make lock` (see README); builds install it with --frozen-lockfile.
packages:
  - .

nodeLinker: hoisted
autoInstallPeers: true
strictDepBuilds: true
allowBuilds:
  node-pty: true
  koffi: true
  fs-ext: true
  "@deepseek-ai/dsh-subprocess-local": true
  '@google/genai': false
  protobufjs: false
  node-addon-require-builtin: false
