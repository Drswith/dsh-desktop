# 工具链与任务的唯一入口。`mise run dev` 跑开发模式，`mise run build` 出正式包。
# 运行 `mise tasks` 看全部任务。

[tools]
# Tauri 外壳用 Rust 构建，版本固定，CI 与本机一致。
rust = "1.89"
# 官方 Rust CLI；Node.js/pnpm 只属于外部 DSH Runner，不属于构建链路。
"cargo:tauri-cli" = "2.11.5"

[tasks.dev]
description = "开发模式启动（测试图标与隔离数据目录）"
dir = "{{config_root}}"
run = "DSH_LAUNCHER_TEST_BUILD=1 cargo tauri dev --config src-tauri/tauri.test.conf.json"

[tasks.build]
description = "出正式包（.app / .dmg 等，产物在 src-tauri/target/release/bundle）"
dir = "{{config_root}}"
run = "cargo tauri build"

[tasks.build-test]
description = "出隔离测试包（Debug，使用 ~/.dsh-launcher-dev）"
dir = "{{config_root}}"
run = "DSH_LAUNCHER_TEST_BUILD=1 cargo tauri build --debug --config src-tauri/tauri.test.conf.json"

[tasks.test]
description = "单元测试"
dir = "{{config_root}}/src-tauri"
run = "cargo test"

[tasks.lint]
description = "格式与 clippy 检查"
dir = "{{config_root}}/src-tauri"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.clean]
description = "清掉构建产物"
dir = "{{config_root}}"
run = "rm -rf src-tauri/target src-tauri/gen"
