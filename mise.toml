# 工具链与任务的唯一入口。`mise run dev` 跑开发模式，`mise run build` 出正式包。
# 运行 `mise tasks` 看全部任务。

[tools]
# Tauri 外壳用 Rust 构建，版本固定，CI 与本机一致。
rust = "1.89"
# 只用来跑官方 @tauri-apps/cli（一个 JS 包）；和 dsh 运行时无关。
node = "22"
pnpm = "10"

[tasks.dev]
description = "开发模式启动（热重载，自动装前端依赖）"
dir = "{{config_root}}"
run = "pnpm install && pnpm tauri dev"

[tasks.build]
description = "出正式包（.app / .dmg 等，产物在 src-tauri/target/release/bundle）"
dir = "{{config_root}}"
run = "pnpm install && pnpm tauri build"

[tasks.test]
description = "单元测试"
dir = "{{config_root}}/src-tauri"
run = "cargo test"

[tasks.lint]
description = "格式与 clippy 检查"
dir = "{{config_root}}/src-tauri"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings"]

[tasks.clean]
description = "清掉构建产物和依赖缓存"
dir = "{{config_root}}"
run = "rm -rf node_modules src-tauri/target src-tauri/gen"
